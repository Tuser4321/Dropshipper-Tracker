<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dropshipper Tracker</title>
<script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-3 md:p-6"><main class="max-w-7xl mx-auto space-y-4">
<header class="flex flex-wrap justify-between items-center gap-2 bg-white px-5 py-3 rounded-xl shadow-sm border"><div class="flex items-center gap-3"><h1 class="text-lg md:text-xl font-bold"><i class="fa-brands fa-whatsapp text-emerald-500"></i> Dropshipper Tracker</h1><span id="syncStatus" class="bg-amber-100 text-amber-700 text-xs px-2.5 py-1 rounded-full">কানেক্ট হচ্ছে...</span></div><div class="flex gap-2"><button onclick="toggleTagModal()" class="bg-purple-600 text-white px-3 py-1.5 rounded-lg text-xs">ট্যাগ সেটিংস</button><button onclick="exportToCSV()" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs">CSV ডাউনলোড</button></div></header>
<section class="bg-white p-3.5 rounded-xl shadow-sm border grid md:grid-cols-12 gap-3 items-center"><div class="md:col-span-7 grid grid-cols-2 sm:grid-cols-4 gap-2"><div class="bg-slate-50 p-2.5 rounded-lg border text-center"><small>মোট লিড</small><h3 id="statTotal" class="text-lg font-bold">0</h3></div><div class="bg-blue-50 p-2.5 rounded-lg border text-center"><small>নতুন লিড</small><h3 id="statBlue" class="text-lg font-bold text-blue-600">0</h3></div><div class="bg-amber-50 p-2.5 rounded-lg border text-center"><small>মেসেজড</small><h3 id="statYellow" class="text-lg font-bold text-amber-600">0</h3></div><div class="bg-emerald-50 p-2.5 rounded-lg border text-center"><small>পজিটিভ ক্লায়েন্ট</small><h3 id="statGreen" class="text-lg font-bold text-emerald-600">0</h3></div></div><div class="md:col-span-5 h-24"><canvas id="improvementChart"></canvas></div></section>
<section class="bg-white p-4 md:p-5 rounded-xl shadow-sm border"><h2 class="text-sm font-semibold mb-3">নতুন লিড সেভ করুন</h2><form id="leadForm" onsubmit="addLead(event)" class="grid grid-cols-1 md:grid-cols-5 gap-3"><input id="phoneInput" required placeholder="ফোন নম্বর *" class="px-3 py-2 rounded-lg border text-xs"><input id="pageInput" placeholder="পেজ বা ওয়েবসাইট লিংক" class="px-3 py-2 rounded-lg border text-xs"><select id="tagSelect" class="px-3 py-2 rounded-lg border text-xs bg-white"></select><input id="noteInput" placeholder="নার্সারিং নোট / মন্তব্য" class="px-3 py-2 rounded-lg border text-xs"><button id="saveBtn" class="bg-indigo-600 text-white py-2 px-3 rounded-lg text-xs">তথ্য যুক্ত করুন</button></form></section>
<section class="bg-white rounded-xl shadow-sm border overflow-hidden"><div class="px-4 py-3 border-b flex flex-wrap justify-between gap-3 bg-slate-50"><b class="text-xs">সকল সংগৃহীত লিড</b><div class="flex gap-2"><select id="filterTag" onchange="renderLeads()" class="px-2 py-1 rounded border text-xs"><option value="ALL">সকল ট্যাগ</option></select><select id="filterRole" onchange="renderLeads()" class="px-2 py-1 rounded border text-xs"><option value="ALL">সকল রোল</option><option value="D">Dropshipper</option><option value="S">Supplier</option></select></div></div><div class="overflow-x-auto"><table class="w-full text-left text-xs"><thead><tr class="bg-slate-100 text-slate-500"><th class="p-3">টাইপ</th><th class="p-3">ফোন</th><th class="p-3">WhatsApp</th><th class="p-3">লিংক</th><th class="p-3">ট্যাগ</th><th class="p-3">নোট</th><th class="p-3">স্ট্যাটাস</th><th class="p-3">অ্যাকশন</th></tr></thead><tbody id="leadTableBody" class="divide-y"></tbody></table></div></section></main>
<div id="tagModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4"><div class="bg-white rounded-xl p-5 max-w-sm w-full"><div class="flex justify-between mb-3"><b>প্রোডাক্ট ট্যাগ সেটিংস</b><button onclick="toggleTagModal()">✕</button></div><form onsubmit="addTag(event)" class="space-y-2"><input id="newTagName" required placeholder="নতুন ট্যাগের নাম" class="w-full px-3 py-2 border rounded text-xs"><input id="newTagIcon" placeholder="ইমেজ URL (ঐচ্ছিক)" class="w-full px-3 py-2 border rounded text-xs"><button class="w-full bg-purple-600 text-white py-2 rounded text-xs">নতুন ট্যাগ যোগ করুন</button></form><div id="tagList" class="mt-3 space-y-1"></div></div></div>
<script>
const firebaseConfig={apiKey:'AIzaSyBkP4Q2YgxaZ2GR7RQZkFnyMu-YrdZjWLg',authDomain:'dropshipper-tracker.firebaseapp.com',projectId:'dropshipper-tracker',storageBucket:'dropshipper-tracker.firebasestorage.app',messagingSenderId:'151194825128',appId:'1:151194825128:web:54d62262e47fcabfd46d9d'};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let leads=[],tags=[],chartInstance=null;const LC='dropshipper_tracker_leads_v2',TC='dropshipper_tracker_tags_v2';
const cache=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};function save(){localStorage.setItem(LC,JSON.stringify(leads));localStorage.setItem(TC,JSON.stringify(tags))}function id(){return 'local_'+Date.now()+'_'+Math.random().toString(36).slice(2)}
function status(s){const e=document.getElementById('syncStatus');e.textContent=s==='ok'?'☁ সিঙ্ক হয়েছে':s==='bad'?'☁ সংযোগ নেই':'⟳ সিঙ্ক হচ্ছে...';e.className='text-xs px-2.5 py-1 rounded-full '+(s==='ok'?'bg-emerald-100 text-emerald-700':s==='bad'?'bg-rose-100 text-rose-700':'bg-amber-100 text-amber-700')}
async function put(col,key,data){try{await db.collection(col).doc(key).set(data,{merge:true});return true}catch(e){console.error(e);status('bad');return false}}
async function seed(col,items){for(const x of items)await put(col,x.docId||id(),Object.fromEntries(Object.entries(x).filter(([k])=>k!=='docId')))}
function boot(){leads=cache(LC,[]);tags=cache(TC,[{docId:id(),name:'blendar',icon:''},{docId:id(),name:'multi function cooker',icon:''}]);renderTags();renderLeads();chart();
 db.collection('tags').onSnapshot(async s=>{if(s.empty){await seed('tags',tags)}else{const cloud=s.docs.map(d=>({docId:d.id,...d.data()}));const cloudIds=new Set(cloud.map(x=>x.docId));const missing=tags.filter(x=>x.docId.startsWith('local_')&&!cloudIds.has(x.docId));if(missing.length)await seed('tags',missing);tags=cloud.concat(missing);save();renderTags();renderLeads();status('ok')}},()=>status('bad'));
 db.collection('leads').orderBy('createdAtTimestamp','desc').onSnapshot(async s=>{if(s.empty){if(leads.length)await seed('leads',leads)}else{const cloud=s.docs.map(d=>({docId:d.id,...d.data()}));const cloudIds=new Set(cloud.map(x=>x.docId));const missing=leads.filter(x=>x.docId.startsWith('local_')&&!cloudIds.has(x.docId));if(missing.length)await seed('leads',missing);leads=cloud.concat(missing).sort((a,b)=>(b.createdAtTimestamp||0)-(a.createdAtTimestamp||0));save();renderLeads();chart();status('ok')}},()=>status('bad'))}
function renderTags(){const o=tags.map(t=>`<option value="${t.docId}">${t.name}</option>`).join('');tagSelect.innerHTML=o;filterTag.innerHTML='<option value="ALL">সকল ট্যাগ</option>'+o;tagList.innerHTML=tags.map(t=>`<div class="flex justify-between p-1 bg-slate-50 border rounded text-xs"><span>${t.name}</span><button class="text-red-500" onclick="deleteTag('${t.docId}')">🗑</button></div>`).join('')}
function renderLeads(){const ft=filterTag.value,fr=filterRole.value;const a=leads.filter(x=>(ft==='ALL'||x.tagDocId===ft)&&(fr==='ALL'||x.role===fr));leadTableBody.innerHTML=a.length?a.map(x=>{const t=tags.find(y=>y.docId===x.tagDocId)||{name:'General'};return `<tr><td class="p-3"><button onclick="update('${x.docId}',{role:'${x.role==='D'?'S':'D'}'})" class="bg-indigo-100 rounded px-2 py-1">${x.role}</button></td><td class="p-3 font-semibold">${x.phone}</td><td class="p-3"><button onclick="wa('${x.docId}')" class="bg-emerald-500 text-white rounded px-2 py-1">WhatsApp</button></td><td class="p-3">${x.page?`<a class="text-indigo-600 underline" target="_blank" href="${x.page.startsWith('http')?x.page:'https://'+x.page}">লিংক</a>`:'—'}</td><td class="p-3">${t.name}</td><td class="p-3"><input class="border rounded px-2 py-1 w-44" value="${String(x.note||'').replace(/"/g,'&quot;')}" onchange="update('${x.docId}',{note:this.value})"></td><td class="p-3"><select class="border rounded px-2 py-1" onchange="update('${x.docId}',{status:this.value})"><option value="blue" ${x.status==='blue'?'selected':''}>নতুন</option><option value="yellow" ${x.status==='yellow'?'selected':''}>মেসেজড</option><option value="green" ${x.status==='green'?'selected':''}>পজিটিভ</option><option value="red" ${x.status==='red'?'selected':''}>নেগেটিভ</option></select></td><td class="p-3"><button class="text-red-500" onclick="del('${x.docId}')">🗑</button></td></tr>`}).join(''):'<tr><td colspan="8" class="p-6 text-center text-slate-400">কোনো তথ্য পাওয়া যায়নি</td></tr>'}
async function update(k,p){const i=leads.findIndex(x=>x.docId===k);if(i<0)return;leads[i]={...leads[i],...p};save();renderLeads();chart();await put('leads',k,p)}
async function addLead(e){e.preventDefault();const d={role:'D',phone:phoneInput.value.trim(),page:pageInput.value.trim(),tagDocId:tagSelect.value,note:noteInput.value.trim(),status:'blue',createdAt:new Date().toLocaleDateString('bn-BD'),createdAtTimestamp:Date.now()},k=id();leads.unshift({docId:k,...d});save();renderLeads();chart();const ok=await put('leads',k,d);if(!ok)alert('ইন্টারনেট সংযোগ না থাকায় ক্লাউডে সেভ হয়নি। সংযোগ ফিরে এলে আবার চেষ্টা করুন।');leadForm.reset()}
function wa(k){const x=leads.find(y=>y.docId===k);if(!x)return;if(x.status==='blue')update(k,{status:'yellow'});let p=x.phone.replace(/\D/g,'');if(p.startsWith('0'))p='88'+p;if(!p.startsWith('880'))p='880'+p;window.open('https://wa.me/'+p,'_blank')}
async function del(k){if(!confirm('আপনি কি নিশ্চিত এই লিডটি মুছে ফেলতে চান?'))return;leads=leads.filter(x=>x.docId!==k);save();renderLeads();chart();try{await db.collection('leads').doc(k).delete()}catch(e){status('bad')}}
async function addTag(e){e.preventDefault();const k=id(),d={name:newTagName.value.trim(),icon:newTagIcon.value.trim()};if(!d.name)return;tags.push({docId:k,...d});save();renderTags();renderLeads();await put('tags',k,d);newTagName.value='';newTagIcon.value=''}
async function deleteTag(k){if(tags.length<=1)return alert('কমপক্ষে একটি ট্যাগ থাকতে হবে।');if(confirm('এই ট্যাগটি ডিলিট করবেন?')){tags=tags.filter(x=>x.docId!==k);save();renderTags();renderLeads();await db.collection('tags').doc(k).delete()}}
function toggleTagModal(){tagModal.classList.toggle('hidden');tagModal.classList.toggle('flex')};function chart(){const c=['blue','yellow','green','red'].map(s=>leads.filter(x=>x.status===s).length);['statTotal','statBlue','statYellow','statGreen'].forEach((x,i)=>document.getElementById(x).textContent=i?c[i-1]:leads.length);if(chartInstance)chartInstance.destroy();chartInstance=new Chart(improvementChart,{type:'bar',data:{labels:['নতুন','মেসেজড','পজিটিভ','নেগেটিভ'],datasets:[{data:c,backgroundColor:['#3b82f6','#f59e0b','#10b981','#f43f5e']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,precision:0}}}})}
function exportToCSV(){if(!leads.length)return alert('ডাউনলোড করার মতো তথ্য নেই!');const csv='Role,Phone,Page,Note,Status,Date\n'+leads.map(x=>`"${x.role}","${x.phone}","${x.page||''}","${x.note||''}","${x.status}","${x.createdAt}"`).join('\n');const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='dropshipper_leads.csv';a.click()}
boot();
</script></body></html>
