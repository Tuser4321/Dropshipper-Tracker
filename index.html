<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropshipper Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-3 md:p-6">
<div class="max-w-7xl mx-auto space-y-4">
  <header class="flex flex-wrap justify-between items-center gap-2 bg-white px-5 py-3 rounded-xl shadow-sm border">
    <div class="flex items-center gap-3"><h1 class="text-lg md:text-xl font-bold"><i class="fa-brands fa-whatsapp text-emerald-500"></i> Dropshipper Tracker</h1><span id="syncStatus" class="bg-amber-100 text-amber-700 text-[11px] px-2.5 py-0.5 rounded-full"><i class="fa-solid fa-spinner fa-spin"></i> কানেক্ট হচ্ছে...</span></div>
    <div class="flex gap-2"><button onclick="toggleTagModal()" class="bg-purple-600 text-white px-3 py-1.5 rounded-lg text-xs"><i class="fa-solid fa-tags"></i> ট্যাগ সেটিংস</button><button onclick="exportToCSV()" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs"><i class="fa-solid fa-file-csv"></i> CSV ডাউনলোড</button></div>
  </header>
  <section class="bg-white p-3.5 rounded-xl shadow-sm border grid grid-cols-1 md:grid-cols-12 gap-3 items-center"><div class="md:col-span-7 grid grid-cols-2 sm:grid-cols-4 gap-2"><div class="bg-slate-50 p-2.5 rounded-lg border text-center"><p class="text-[10px] font-bold text-slate-400">মোট লিড</p><h3 id="statTotal" class="text-lg font-bold">0</h3></div><div class="bg-blue-50 p-2.5 rounded-lg border text-center"><p class="text-[10px] font-bold text-blue-600">নতুন লিড</p><h3 id="statBlue" class="text-lg font-bold text-blue-600">0</h3></div><div class="bg-amber-50 p-2.5 rounded-lg border text-center"><p class="text-[10px] font-bold text-amber-600">মেসেজড</p><h3 id="statYellow" class="text-lg font-bold text-amber-600">0</h3></div><div class="bg-emerald-50 p-2.5 rounded-lg border text-center"><p class="text-[10px] font-bold text-emerald-600">পজিটিভ ক্লায়েন্ট</p><h3 id="statGreen" class="text-lg font-bold text-emerald-600">0</h3></div></div><div class="md:col-span-5 h-24"><canvas id="improvementChart"></canvas></div></section>
  <section class="bg-white p-4 md:p-5 rounded-xl shadow-sm border"><h2 class="text-sm font-semibold mb-3"><i class="fa-solid fa-user-plus text-indigo-600"></i> নতুন লিড সেভ করুন</h2><form id="leadForm" onsubmit="addLead(event)" class="grid grid-cols-1 md:grid-cols-5 gap-3"><input id="phoneInput" required placeholder="ফোন নম্বর *" class="px-3 py-2 rounded-lg border text-xs"><input id="pageInput" placeholder="পেজ বা ওয়েবসাইট লিংক" class="px-3 py-2 rounded-lg border text-xs"><select id="tagSelect" class="px-3 py-2 rounded-lg border text-xs bg-white"></select><input id="noteInput" placeholder="নার্সারিং নোট / মন্তব্য" class="px-3 py-2 rounded-lg border text-xs"><button id="saveBtn" class="bg-indigo-600 text-white font-medium py-2 px-3 rounded-lg text-xs"><i class="fa-solid fa-plus"></i> তথ্য যুক্ত করুন</button></form></section>
  <section class="bg-white rounded-xl shadow-sm border overflow-hidden"><div class="px-4 py-3 border-b flex flex-wrap justify-between items-center gap-3 bg-slate-50"><span class="font-semibold text-slate-700 text-xs">সকল সংগৃহীত লিড ও নার্সারিং হিস্ট্রি</span><div class="flex gap-2"><select id="filterTag" onchange="renderLeads()" class="px-2.5 py-1 rounded-lg border text-xs bg-white"><option value="ALL">সকল ট্যাগ</option></select><select id="filterRole" onchange="renderLeads()" class="px-2.5 py-1 rounded-lg border text-xs bg-white"><option value="ALL">সকল রোল (D & S)</option><option value="D">শুধুমাত্র Dropshipper (D)</option><option value="S">শুধুমাত্র Supplier (S)</option></select></div></div><div class="overflow-x-auto"><table class="w-full text-left text-xs"><thead><tr class="bg-slate-100 border-b text-[11px] text-slate-500"><th class="p-3">টাইপ</th><th class="p-3">ফোন নম্বর</th><th class="p-3">WhatsApp</th><th class="p-3">লিংক</th><th class="p-3">ট্যাগ</th><th class="p-3">নোট</th><th class="p-3">স্ট্যাটাস</th><th class="p-3">অ্যাকশন</th></tr></thead><tbody id="leadTableBody" class="divide-y"></tbody></table></div></section>
</div>
<div id="tagModal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center z-50 p-4"><div class="bg-white rounded-xl p-5 max-w-sm w-full shadow-xl"><div class="flex justify-between border-b pb-2 mb-3"><h3 class="font-bold text-sm">প্রোডাক্ট ট্যাগ সেটিংস</h3><button onclick="toggleTagModal()">✕</button></div><form onsubmit="addTag(event)" class="space-y-2"><input id="newTagName" required placeholder="নতুন ট্যাগের নাম" class="w-full px-3 py-2 rounded-lg border text-xs"><input id="newTagIcon" placeholder="ইমেজ / লোগো URL (ঐচ্ছিক)" class="w-full px-3 py-2 rounded-lg border text-xs"><button class="w-full bg-purple-600 text-white py-2 rounded-lg text-xs">নতুন ট্যাগ যোগ করুন</button></form><div id="tagList" class="mt-3 space-y-1.5 max-h-36 overflow-y-auto"></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBkP4Q2YgxaZ2GR7RQZkFnyMu-YrdZjWLg",authDomain:"dropshipper-tracker.firebaseapp.com",databaseURL:"https://dropshipper-tracker-default-rtdb.firebaseio.com",projectId:"dropshipper-tracker",storageBucket:"dropshipper-tracker.firebasestorage.app",messagingSenderId:"151194825128",appId:"1:151194825128:web:54d62262e47fcabfd46d9d",measurementId:"G-QYBHBEDVFR"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
let leads=[],tags=[],chartInstance=null; const LEADS_CACHE='dropshipper_tracker_leads_v1',TAGS_CACHE='dropshipper_tracker_tags_v1';
const readCache=(key, fallback)=>{try{return JSON.parse(localStorage.getItem(key))||fallback}catch(e){return fallback}};
function saveCache(){localStorage.setItem(LEADS_CACHE,JSON.stringify(leads));localStorage.setItem(TAGS_CACHE,JSON.stringify(tags));}
function setCloudStatus(s){const e=document.getElementById('syncStatus');e.className='text-[11px] px-2.5 py-0.5 rounded-full '+(s==='synced'?'bg-emerald-100 text-emerald-700':s==='offline'?'bg-rose-100 text-rose-700':'bg-amber-100 text-amber-700');e.innerHTML=s==='synced'?'☁ সিঙ্ক':s==='offline'?'☁ অফলাইন':'⟳ কানেক্ট হচ্ছে...'}
function makeId(){return 'local_'+Date.now()+'_'+Math.random().toString(36).slice(2)}
function cloudWrite(collection,id,data){return db.collection(collection).doc(id).set(data,{merge:true}).catch(()=>{setCloudStatus('offline')})}
function boot(){leads=readCache(LEADS_CACHE,[]);tags=readCache(TAGS_CACHE,[]);renderTags();renderLeads();updateChart();
 db.collection('tags').onSnapshot(s=>{if(!s.empty){tags=s.docs.map(d=>({docId:d.id,...d.data()}));saveCache();renderTags();renderLeads()}else if(tags.length){tags.forEach(t=>cloudWrite('tags',t.docId||makeId(),{name:t.name,icon:t.icon||''}))}else{['blendar','multi function cooker'].forEach(name=>db.collection('tags').add({name,icon:''}))}},()=>setCloudStatus('offline'));
 db.collection('leads').orderBy('createdAtTimestamp','desc').onSnapshot(s=>{setCloudStatus('synced');if(!s.empty||!leads.length){leads=s.docs.map(d=>({docId:d.id,...d.data()}));saveCache();renderLeads();updateChart()}else{leads.forEach(l=>cloudWrite('leads',l.docId||makeId(),l))}},()=>setCloudStatus('offline'));
}
function renderTags(){const opts=tags.map(t=>`<option value="${t.docId}">${t.name}</option>`).join('');document.getElementById('tagSelect').innerHTML=opts;document.getElementById('filterTag').innerHTML='<option value="ALL">সকল ট্যাগ</option>'+opts;document.getElementById('tagList').innerHTML=tags.map(t=>`<div class="flex justify-between p-1.5 bg-slate-50 rounded border text-xs"><span>${t.icon?`<img src="${t.icon}" class="inline w-4 h-4 object-contain">`:''} ${t.name}</span><button class="text-red-500" onclick="deleteTag('${t.docId}')">🗑</button></div>`).join('')}
function renderLeads(){const ft=document.getElementById('filterTag').value,fr=document.getElementById('filterRole').value;const list=leads.filter(l=>(ft==='ALL'||l.tagDocId===ft)&&(fr==='ALL'||l.role===fr));document.getElementById('leadTableBody').innerHTML=list.length?list.map(l=>{const t=tags.find(x=>x.docId===l.tagDocId)||{name:'General'};return `<tr class="hover:bg-slate-50"><td class="p-3"><button onclick="toggleRole('${l.docId}','${l.role}')" class="rounded-full px-2 py-1 bg-indigo-100 font-bold">${l.role}</button></td><td class="p-3 font-semibold">${l.phone}</td><td class="p-3"><button onclick="triggerWhatsApp('${l.phone}','${l.docId}','${l.status}')" class="bg-emerald-500 text-white px-2 py-1 rounded">WhatsApp</button></td><td class="p-3">${l.page?`<a class="text-indigo-600 underline" target="_blank" href="${l.page.startsWith('http')?l.page:'https://'+l.page}">লিংক</a>`:'—'}</td><td class="p-3">${t.name}</td><td class="p-3"><input value="${(l.note||'').replace(/"/g,'&quot;')}" onchange="updateLead('${l.docId}',{note:this.value})" class="border rounded px-2 py-1 w-44"></td><td class="p-3"><select onchange="updateLead('${l.docId}',{status:this.value})" class="border rounded px-2 py-1"><option value="blue" ${l.status==='blue'?'selected':''}>নতুন</option><option value="yellow" ${l.status==='yellow'?'selected':''}>মেসেজড</option><option value="green" ${l.status==='green'?'selected':''}>পজিটিভ</option><option value="red" ${l.status==='red'?'selected':''}>নেগেটিভ</option></select></td><td class="p-3"><button onclick="deleteLead('${l.docId}')" class="text-red-500">🗑</button></td></tr>`}).join(''):'<tr><td colspan="8" class="p-6 text-center text-slate-400">কোনো তথ্য পাওয়া যায়নি</td></tr>'}
function updateLead(id,patch){const i=leads.findIndex(l=>l.docId===id);if(i<0)return;leads[i]={...leads[i],...patch};saveCache();renderLeads();updateChart();cloudWrite('leads',id,patch)}
function addLead(e){e.preventDefault();const data={role:'D',phone:phoneInput.value.trim(),page:pageInput.value.trim(),tagDocId:tagSelect.value,note:noteInput.value.trim(),status:'blue',createdAt:new Date().toLocaleDateString('bn-BD'),createdAtTimestamp:Date.now()};const id=makeId();leads.unshift({docId:id,...data});saveCache();renderLeads();updateChart();cloudWrite('leads',id,data);document.getElementById('leadForm').reset()}
function toggleRole(id,r){updateLead(id,{role:r==='D'?'S':'D'})} function triggerWhatsApp(phone,id,status){if(status==='blue')updateLead(id,{status:'yellow'});let p=phone.replace(/\D/g,'');if(p.startsWith('0'))p='88'+p;if(!p.startsWith('880'))p='880'+p;window.open('https://wa.me/'+p,'_blank')}
function deleteLead(id){if(confirm('আপনি কি নিশ্চিত এই লিডটি মুছে ফেলতে চান?')){leads=leads.filter(l=>l.docId!==id);saveCache();renderLeads();updateChart();db.collection('leads').doc(id).delete().catch(()=>{})}}
function addTag(e){e.preventDefault();const id=makeId(),data={name:newTagName.value.trim(),icon:newTagIcon.value.trim()};if(!data.name)return;tags.push({docId:id,...data});saveCache();renderTags();renderLeads();cloudWrite('tags',id,data);newTagName.value='';newTagIcon.value=''}
function deleteTag(id){if(tags.length<=1)return alert('কমপক্ষে একটি ট্যাগ থাকতে হবে।');if(confirm('এই ট্যাগটি ডিলিট করবেন?')){tags=tags.filter(t=>t.docId!==id);saveCache();renderTags();renderLeads();db.collection('tags').doc(id).delete().catch(()=>{})}}
function toggleTagModal(){document.getElementById('tagModal').classList.toggle('hidden');document.getElementById('tagModal').classList.toggle('flex')}
function updateChart(){const c=['blue','yellow','green','red'].map(s=>leads.filter(l=>l.status===s).length);['statTotal','statBlue','statYellow','statGreen'].forEach((id,i)=>document.getElementById(id).innerText=i?c[i-1]:leads.length);if(chartInstance)chartInstance.destroy();chartInstance=new Chart(document.getElementById('improvementChart'),{type:'bar',data:{labels:['নতুন','মেসেজড','পজিটিভ','নেগেটিভ'],datasets:[{data:c,backgroundColor:['#3b82f6','#f59e0b','#10b981','#f43f5e'],borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,precision:0}}}})}
function exportToCSV(){if(!leads.length)return alert('ডাউনলোড করার মতো তথ্য নেই!');let csv='Role,Phone,Page,Note,Status,Date\n'+leads.map(l=>`"${l.role}","${l.phone}","${l.page||''}","${l.note||''}","${l.status}","${l.createdAt}"`).join('\n');const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='dropshipper_leads.csv';a.click()}
boot();
</script></body></html>
